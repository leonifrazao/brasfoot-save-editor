name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e testar
        run: mvn -B verify

      - name: Empacotar o ZIP para Windows
        run: bash scripts/package-windows-bundle.sh

      - name: Disponibilizar JAR e ZIP
        uses: actions/upload-artifact@v7
        with:
          name: brasfoot-save-editor
          path: |
            target/brasfoot-save-editor.jar
            target/brasfoot-save-editor-windows.zip
          if-no-files-found: error
          compression-level: 0
